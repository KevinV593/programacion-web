<!DOCTYPE html>
<html lang="es-EC">
    <head>
        <meta charset="UTF-8" />
        <!-- Compatabilidad Vers. XHTML-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mi Portafolio</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="mediaqueries.css" />
    </head>
    <body>
        <nav id="desktop-nav">
            <div class="logo">Kevin Vaca</div>
            <div>
                <ul class="nav-links">
                    <li><a href="#sobre-mi">Sobre mí</a></li>
                    <li><a href="#experiencia">Experiencia</a></li>
                    <li><a href="#proyectos">Proyectos</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </nav>
        
        <nav id="hamburgesa-nav">
            <div class="logo">Kevin Vaca</div>
            <div class="hamburgesa-menu">
                <input type="checkbox" id="menu-toggle" hidden />
                <label for="menu-toggle" class="hamburgesa-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <div class="menu-links">
                    <li><a href="#sobre-mi">Sobre mí</a></li>
                    <li><a href="#experiencia">Experiencia</a></li>
                    <li><a href="#proyectos">Proyectos</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </div>
            </div>
        </nav>
        <section id="profile">
            <div class="section__pic-container">
                <img src="./assets/profile-pic.png" alt="John Doe profile picture" />
            </div>
            <div class="section__text">
                <p class="section__text__p1">Hola, soy</p>
                <h1 class="title">Kevin Vaca</h1>
                <p class="section__text__p2">Ing. Software</p>
                <div class="btn-container">
                    <button
                        class="btn btn-color-2"
                        onclick="window.open('./assets/resume-example.pdf')"
                    >
                        Descargar CV
                    </button>
                    <button class="btn btn-color-1" onclick="location.href='./#contact'">
                        Contacto
                    </button>
                </div>
                <div id="socials-container">
                    <img
                        src="./assets/linkedin.png"
                        alt="Mi LinkedIn"
                        class="icon"
                        onclick="location.href='https://linkedin.com/'"
                    />
                    <img
                        src="./assets/github.png"
                        alt="Mi Github"
                        class="icon"
                        onclick="location.href='https://github.com/'"
                    />                                      
                </div>
            </div>
        </section>
            <script src = "script.js"></script>
    </body>
</html>
